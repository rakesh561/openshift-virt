name: Cluster Name Validation

on:
  pull_request:
    branches:
      - automation

jobs:
  validate-cluster-name:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate cluster_name against folder name
        run: |
          set -e
          error=0
          files=$(find automation/vars/hypervisor-clusters -type f -name core.yaml)
          for file in $files; do
            folder_name=$(basename "$(dirname "$file")")
            # Extract cluster_name value (ignores spaces before/after :)
            cluster_name=$(grep -E '^[[:space:]]*cluster_name:' "$file" | awk -F: '{gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2}')

            if [[ -z "$cluster_name" ]]; then
              echo "⚠️  No cluster_name found in $file"
              continue
            fi

            if [[ "$folder_name" != "$cluster_name" ]]; then
              echo "❌ Error in $file"
              echo "   Folder name     = $folder_name"
              echo "   cluster_name    = $cluster_name"
              echo "They must match!"
              error=1
            fi
          done

          if [[ $error -ne 0 ]]; then
            exit 1
          else
            echo "✅ All cluster_name values match their folder names."
          fi
